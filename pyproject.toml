[build-system]
requires = ["setuptools>=45", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "ztfalertvalidation"
version = "0.1.0"
description = "Compare ZTF avro alerts from the DZA pipeline and the official IPAC pipeline"
authors = [
    {name = "Robert Stein", email = "rdstein@umd.edu"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Intended Audience :: Science/Research',
    'Intended Audience :: End Users/Desktop',
    'Intended Audience :: Developers',
    'Natural Language :: English',
    'Topic :: Scientific/Engineering',
    'Topic :: Scientific/Engineering :: Astronomy',
    'Topic :: Scientific/Engineering :: Physics',
    'Operating System :: POSIX',
    'Operating System :: Unix',
    'Operating System :: MacOS',
]
dependencies = [
    "python-dotenv",
    "fastavro",
    "pandas",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "black",
    "isort",
    "pylint",
    "mypy",
    "autotyping",
    "pytest",
    "coveralls",
    "jupyter",
]

[project.urls]
Homepage = "https://github.com/robertdstein/ztfalertvalidation"

[tool.setuptools]
packages = ["ztfalertvalidation"]

[tool.coverage.run]
source = ["ztfalertvalidation"]

[tool.isort]
profile = "black"

[tool.pylint.format]
max-line-length = "88"
disable=["logging-fstring-interpolation"]
good-names=["ax", "ra", "df", "pi", "i"]
max-public-methods=25

[tool.pylint.design]
ignored-argument-names = "self|cls"

[tool.mypy]
disable_error_code = ["import-untyped", "prop-decorator"]
